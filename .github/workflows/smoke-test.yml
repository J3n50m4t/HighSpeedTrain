name: Smoke test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Headless mod load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install LuaJIT (syntax check)
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
